{% extends 'base.html' %}

{% block title %}Crear programa{% endblock %}

{% block content %}
    <h2>Crear programa</h2>

    {% if mensaje %}
        <div class="ok">{{ mensaje }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Guardar</button>
    </form>
{% endblock %}
